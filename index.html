  const originalAbsStoreKey='sm-original-abstracts-v3';

  const normalizedTitle=s=>String(s||'').normalize('NFKD').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
  const cleanDoi=s=>{
    const d=String(s||'').replace(/^https?:\/\/(?:dx\.)?doi\.org\//i,'').trim();
    return /^10\.\d{4,9}\/[^\s<>"']+$/i.test(d)?d:'';

  const pubLink=s=>{try{const u=new URL(s);return u.protocol==='https:'?u.href:''}catch{return ''}};

  function extractPlainText(markup){
    if(!markup)return '';
    const html=String(markup).replace(/<\/?(?:jats:)?(?:p|sec|title|br|abstract)(?:\s[^>]*?)?\s*\/?>/gi,' ');
    const doc=new DOMParser().parseFromString(html,'text/html');

  function invertedIndexToText(index){
    if(!index||typeof index!=='object')return '';
    const tokens=[];
    for(const [word, positions] of Object.entries(index)){
      if(!Array.isArray(positions))continue;
      for(const pos of positions)if(Number.isInteger(pos)&&pos>=0&&pos<8000)tokens[pos]=word;

    return tokens.filter(x=>typeof x==='string').join(' ').trim();

  function isExactPaper(p,title,year,authors,doi){

  const embeddedOriginalAbstracts = {143: {"title": "Semantic Representation Attack Against Aligned Large Language Models", "abstract": "Large Language Models (LLMs) increasingly employ alignment techniques to prevent harmful outputs. Despite these safeguards, attackers can circumvent them by crafting prompts that induce LLMs to generate harmful content. Current methods typically target exact affirmative responses, suffering from limited convergence, unnatural prompts, and high computational costs. We introduce semantic representation attacks, a novel paradigm that fundamentally reconceptualizes adversarial objectives against aligned LLMs. Rather than targeting exact textual patterns, our approach exploits the semantic representation space that can elicit diverse responses that share equivalent harmful meanings. This innovation resolves the inherent trade-off between attack effectiveness and prompt naturalness that plagues existing methods. Our Semantic Representation Heuristic Search (SRHS) algorithm efficiently generates semantically coherent adversarial prompts by maintaining interpretability during incremental search. We establish rigorous theoretical guarantees for semantic convergence and demonstrate that SRHS achieves unprecedented attack success rates (89.4% averaged across 18 LLMs, including 100% on 11 models) while significantly reducing computational requirements. Extensive experiments show that our method consistently outperforms existing approaches.", "doi": "10.52202/085713-2437", "source": "Author-supplied", "url": "https://proceedings.neurips.cc/paper_files/paper/2025/hash/6958e9d0f5a76d54ff97da8c45f4d52e-Abstract-Conference.html"}};

  async function readJson(url,params){

    const endpoint='https://api.crossref.org/works';
    const j=doi ? await readJson(endpoint+'/'+encodeURI(doi))
      : await readJson(endpoint,{'query.title':p.title,rows:5});
    for(const item of doi?[j.message]:(j.message?.items||[])){
      if(!item)continue;
      const year=item.published?.['date-parts']?.[0]?.[0]||item.issued?.['date-parts']?.[0]?.[0]||item.created?.['date-parts']?.[0]?.[0];
      if(!isExactPaper(p,item.title?.[0],year,(item.author||[]).map(a=>a.family||a.name),item.DOI))continue;
      const record=originalRecord(p,item.abstract,item.DOI,'Crossref',
        'https://doi.org/'+cleanDoi(item.DOI));
      if(record)return record;
    }
    return null;
  }
  async function fromEuropePmc(p){
    const doi=cleanDoi(p.doi);
    const q=doi?'DOI:"'+doi+'"':'TITLE:"'+p.title+'"';
    const j=await readJson('https://www.ebi.ac.uk/europepmc/webservices/rest/search',
      {query:q,format:'json',resultType:'core',pageSize:5});
    for(const item of j.resultList?.result||[]){
      if(!isExactPaper(p,item.title,item.pubYear,[item.authorString],item.doi))continue;
      const record=originalRecord(p,item.abstractText,item.doi,'Europe PMC',
        cleanDoi(item.doi)?'https://doi.org/'+cleanDoi(item.doi):
          (item.id&&item.source?'https://europepmc.org/article/'+encodeURIComponent(item.source)+'/'+encodeURIComponent(item.id):''));
      if(record)return record;
    }
    return null;
  }
  async function fromOpenAlex(p){
    const doi=cleanDoi(p.doi),fields='id,doi,title,publication_year,authorships,abstract_inverted_index,primary_location';
    const j=doi ? await readJson('https://api.openalex.org/works/doi:'+doi,{select:fields})
      : await readJson('https://api.openalex.org/works',{search:p.title,per_page:5,select:fields});
    for(const item of doi?[j]:(j.results||[])){
      if(!isExactPaper(p,item.title||item.display_name,item.publication_year,
        (item.authorships||[]).flatMap(a=>[a.author?.display_name,a.raw_author_name]),item.doi))continue;
      const sourceUrl=cleanDoi(item.doi)?'https://doi.org/'+cleanDoi(item.doi):
          (pubLink(item.primary_location?.landing_page_url)||pubLink(item.id));
      const record=originalRecord(p,invertedIndexToText(item.abstract_inverted_index),item.doi,'OpenAlex',sourceUrl);
      if(record)return record;
    }
    return null;
  }
  async function fromSemanticScholar(p){
    const doi=cleanDoi(p.doi),fields='title,abstract,year,authors,externalIds,url';
    const root='https://api.semanticscholar.org/graph/v1/paper';
    const j=doi?await readJson(root+'/DOI:'+doi,{fields})
      : await readJson(root+'/search',{query:p.title,limit:5,fields});
    for(const item of doi?[j]:(j.data||[])){
      const itemDoi=item?.externalIds?.DOI;
      if(!isExactPaper(p,item.title,item.year,(item.authors||[]).map(a=>a.name),itemDoi))continue;
      const record=originalRecord(p,item.abstract,itemDoi,'Semantic Scholar',
        cleanDoi(itemDoi)?'https://doi.org/'+cleanDoi(itemDoi):item.url);
      if(record)return record;
    }
    return null;
  }
  async function fetchOriginalAbstract(p){
    if(originalAbsCache[p.id])return originalAbsCache[p.id];
    if(originalAbsPending.has(p.id))return originalAbsPending.get(p.id);
    const pending=(async()=>{
      const results=await Promise.allSettled([fromCrossref(p),fromEuropePmc(p),fromOpenAlex(p)]);
      let record=results.map(r=>r.status==='fulfilled'?r.value:null).find(Boolean)||null;
      if(!record)try{record=await fromSemanticScholar(p)}catch{}
      if(record&&validOriginalRecord(p,record)){
        originalAbsCache[p.id]=record;
        try{localStorage.setItem(originalAbsStoreKey,JSON.stringify(originalAbsCache))}catch{}
        return record;
      }
      return null;
    })();
    originalAbsPending.set(p.id,pending);
    try{return await pending}finally{originalAbsPending.delete(p.id)}
  }
  const abstractLookupsChecked=new Set();
  const abstractLookupsQueued=new Set();
  const abstractLookupQueue=[];
  let abstractLookupsActive=0;
  let abstractObserver=null;
  function scheduleAbstractLookup(id){
    if(!byId[id]||originalAbsCache[id]||abstractLookupsChecked.has(id)||abstractLookupsQueued.has(id))return;
    abstractLookupsQueued.add(id);
    abstractLookupQueue.push(id);
    runAbstractLookupQueue();
  }
  function runAbstractLookupQueue(){
    while(abstractLookupsActive<2&&abstractLookupQueue.length){
      const id=abstractLookupQueue.shift();
      abstractLookupsQueued.delete(id);
      if(abstractLookupsChecked.has(id)||originalAbsCache[id])continue;
      abstractLookupsChecked.add(id);
      abstractLookupsActive++;
      fetchOriginalAbstract(byId[id]).then(record=>{
        if(!record||!validOriginalRecord(byId[id],record))return;
        document.querySelectorAll('[data-abstract-id="'+id+'"]')
          .forEach(slot=>{slot.innerHTML=abstractMarkup(record)});
      }).catch(()=>{}).finally(()=>{abstractLookupsActive--;runAbstractLookupQueue()});
    }
  }
  function observeAbstractSlots(){
    if(abstractObserver)abstractObserver.disconnect();
    const slots=[...document.querySelectorAll('[data-abstract-id]')];
    for(const slot of slots){
      const id=Number(slot.dataset.abstractId),record=originalAbsCache[id];
      if(record&&validOriginalRecord(byId[id],record))slot.innerHTML=abstractMarkup(record);
    }
    if('IntersectionObserver' in window){
      abstractObserver=new IntersectionObserver(entries=>{
        for(const e of entries)if(e.isIntersecting){
          abstractObserver.unobserve(e.target);
          scheduleAbstractLookup(Number(e.target.dataset.abstractId));
        }
      },{rootMargin:'180px 0px',threshold:0});
      for(const slot of slots)if(!slot.firstElementChild)abstractObserver.observe(slot);
    }else{
      for(const slot of slots.slice(0,12))if(!slot.firstElementChild)scheduleAbstractLookup(Number(slot.dataset.abstractId));
    }
  }
  window.addEventListener('hashchange',route);document.getElementById('footer-year').textContent='2026';route();
  </script>
